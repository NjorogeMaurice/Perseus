server {
    listen       80;
    listen  [::]:80;
    server_name  dassa.aphrc.org;

    #   location / {
    #       rewrite ^/(.*)$ /$1 break;
    #       proxy_set_header            X-Real-IP $remote_addr;
    #       proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
    #       proxy_set_header            X-Forwarded-Proto $scheme;
    #       proxy_set_header            Host $host;
    #       proxy_pass                  http://frontend:4200;  # Use service name 'frontend'
    #   }
      
      location / {
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://frontend:4200;  # Use service name 'frontend'
      }

      location /backend {
          auth_request                /user/api/is_token_valid_internal;
          auth_request_set            $username $upstream_http_Username;
          proxy_set_header            Username $username;
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://backend:5004;  # Use service name 'backend'
      }

      location //user {
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://user:5001;  # Use service name 'user'
      }

      location //user/api/is_token_valid_internal {
          if ($request_uri ~ .*\/api\/info$) {
              return 200;
          }
          if ($request_method = 'OPTIONS') {
              return 200;
          }
          internal;
          proxy_pass_request_body     off;
          proxy_set_header            Content-Length "";
          proxy_set_header            X-Original-URI $request_uri;
          proxy_pass                  http://user:5001;  # Use service name 'user'

          proxy_cache                 token_responses;
          proxy_cache_key             $http_Authorization;
          proxy_cache_lock            on;
          proxy_cache_valid           200 300s;
          proxy_cache_use_stale       error timeout;
      }

      location /white-rabbit {
          auth_request                /user/api/is_token_valid_internal;
          auth_request_set            $username $upstream_http_Username;
          proxy_set_header            Username $username;
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://white-rabbit:8000;  # Use service name 'white-rabbit'
      }

      location /cdm-builder {
          auth_request                /user/api/is_token_valid_internal;
          auth_request_set            $username $upstream_http_Username;
          proxy_set_header            Username $username;
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://cdm-builder:9000;  # Use service name 'cdm-builder'
      }

      location /data-quality-dashboard/api {
          auth_request                /user/api/is_token_valid_internal;
          auth_request_set            $username $upstream_http_Username;
          proxy_set_header            Username $username;
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://data-quality-dashboard:8001;  # Use service name 'data-quality-dashboard'
      }

      location /data-quality-dashboard {
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://data-quality-dashboard:8001;  # Use service name 'data-quality-dashboard'
      }

      location /athena {
          auth_request                /user/api/is_token_valid_internal;
          auth_request_set            $username $upstream_http_Username;
          proxy_set_header            Username $username;
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://athena:5002;  # Use service name 'athena'
      }

      location /solr {
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://solr:8983;  # Use service name 'solr'
      }

      location /usagi {
          auth_request                /user/api/is_token_valid_internal;
          auth_request_set            $username $upstream_http_Username;
          proxy_set_header            Username $username;
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://usagi:5003;  # Use service name 'usagi'
      }

      location /swagger {
          proxy_set_header            X-Real-IP $remote_addr;
          proxy_set_header            X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header            X-Forwarded-Proto $scheme;
          proxy_set_header            Host $host;
          proxy_pass                  http://swagger:8080;  # Use service name 'swagger'
      }
    }